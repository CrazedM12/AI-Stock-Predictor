<!DOCTYPE html>
<html>
<head>
    <title>AI Stock Chart Analyzer</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        textarea { width: 100%; height: 120px; }
        .response { margin-top: 20px; padding: 15px; background: #f0f0f0; }
    </style>
</head>
<body>

<h1>AI Stock Chart Analyzer</h1>

<form method="POST" enctype="multipart/form-data">
    <label>Upload Chart:</label><br>
    <input type="file" name="chart" required><br><br>

    <label>Message to AI:</label><br>
    <textarea name="message" required>Analyze this chart using my strategy.</textarea><br><br>

    <button type="submit">Analyze Chart</button>
</form>

{% if ai_response %}
<div class="response">
    <h2>AI Response:</h2>
    <p>{{ ai_response }}</p>
</div>
{% endif %}

</body>
</html>
